name: RustMCP Harbor weekly image

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/dependabot.yml
      - .github/workflows/rustmcp-harbor-weekly.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: rustmcp-harbor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve image name and weekly tag
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rustmcp-harbor" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=weekly-${{ steps.vars.outputs.date }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=RustMCP Harbor
            org.opencontainers.image.description=Generic Rust development harbor with MCPX and OpenAI Secure MCP Tunnel for ChatGPT and Codex

      - name: Build and push fresh multi-arch image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test published image
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:latest"

          for platform in linux/amd64 linux/arm64; do
            echo "Smoke testing ${platform}"
            docker run --rm --platform "${platform}" "${IMAGE}:latest" versions
            uid="$(docker run --rm --platform "${platform}" --entrypoint /usr/bin/id "${IMAGE}:latest" -u)"
            test "${uid}" = "568"
          done

          set +e
          output="$(docker run --rm --platform linux/amd64 "${IMAGE}:latest" 2>&1)"
          status=$?
          set -e
          test "${status}" = "64"
          grep -F "RustMCP Harbor intentionally ships with no default MCPX configuration." <<<"${output}"
