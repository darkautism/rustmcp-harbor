# rustmcp-harbor-managed-config-v2
server:
    host: __HOST_IP__
    port: 9090
    disable_localhost_protection: true
    trust_proxy_headers: true
    allowed_origins: ["https://chatgpt.com"]
auth:
    mode: oauth
    token: 
    oauth:
        password: "__OAUTH__"
        server_url: "__HOSTNAME__"
        token_ttl: 86400
        token_secret: ""
        client_id: ""
        client_secret: ""
        redirect_uris: []

workspaces:
  - name: workspace
    path: /workspace
    description: "Project mounted into RustMCP Harbor"

security:
  commands:
    default: allow
    allow:
      - .*
    confirm: []
    deny: []

  files:
    max_read_bytes: 4194304
    max_patch_files: 50
    max_patch_lines: 5000
    allow:
      - .*
    deny: []

limits:
  max_result_bytes: 262144
